<!DOCTYPE html>
<html>
<head>
    <title>Network Scanner</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="static/favicon.ico">
    <script src="https://unpkg.com/timeago.js@4.0.2/dist/timeago.min.js"></script>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css"
    >

    <link rel="stylesheet" href="static/styles.css?v=2.0.1">
</head>
<body>
    <div class="header">
        <h2>🔎 Network Scanner</h2>
        <div class="header-actions">
        <button id="themeToggle" onclick="toggleTheme()" class="button-with-icon">
            <span class="mdi mdi-weather-night button-icon"></span>
            Dark
        </button>

        <button onclick="resetThemeToAuto()" class="button-with-icon">
            <span class="mdi mdi-auto-fix button-icon"></span>
            Auto
        </button>
        </div>
    </div>

    <div class="actions">
        <input
            type="text"
            id="searchInput"
            placeholder="Search IP, Name, Vendor or MAC..."
            oninput="applySearch(this.value)"
        >
        
        <button
            id="savedFilterButton"
            onclick="cycleSavedFilter()"
            class="icon-button filter-button"
            title="Saved filter: All"
        >
            <span class="mdi mdi-content-save-outline button-icon"></span>
        </button>

        <button
            id="trackedFilterButton"
            onclick="cycleTrackedFilter()"
            class="icon-button filter-button"
            title="Tracked filter: All"
        >
            <span class="mdi mdi-map-marker-outline button-icon"></span>
        </button>

        <button
            id="onlineFilterButton"
            onclick="cycleOnlineFilter()"
            class="icon-button filter-button"
            title="Online filter: All"
        >
            <span class="mdi mdi-power-plug-outline button-icon"></span>
        </button>

        <button onclick="toggleSortDirection()" class="icon-button" title="Toggle sort direction">
            <span class="mdi mdi-sort button-icon"></span>
        </button>

        <button onclick="exportBackup()" class="icon-button export-button" title="Export">
            <span class="mdi mdi-download button-icon"></span>
        </button>

        <button onclick="document.getElementById('importFile').click()" class="icon-button import-button" title="Import">
            <span class="mdi mdi-upload button-icon"></span>
        </button>

        <button onclick="confirmClearAll()" class="icon-button danger-button delete-all-button" title="Delete All">
            <span class="mdi mdi-delete-outline button-icon"></span>
        </button>
    </div>

    <input
        type="file"
        id="importFile"
        accept=".json"
        onchange="importBackup(event)"
        hidden
    >

    <p id="status">⏳ Ready</p>
    <table id="table"></table>

    <div class="actions bottom-actions">
        <button onclick="window.open('scan', '_blank')" class="button-with-icon">
            <span class="mdi mdi-database-search-outline button-icon"></span>
            Scan Results
        </button>

        <button onclick="window.open('scan/status', '_blank')" class="button-with-icon">
            <span class="mdi mdi-information-outline button-icon"></span>
            Scan Status
        </button>

        <button onclick="window.open('mdns', '_blank')" class="button-with-icon">
            <span class="mdi mdi-lan-connect button-icon"></span>
            mDNS Cache
        </button>
    </div>
    <script>
const THEME_STORAGE_KEY = "networkScannerTheme";

function buttonLabel(icon, text) {
    return `<span class="mdi ${icon} button-icon"></span> ${text}`;
}

function getSystemTheme() {
    return window.matchMedia &&
           window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark"
        : "light";
}

function getStoredTheme() {
    return localStorage.getItem(THEME_STORAGE_KEY);
}

function applyTheme(theme, source = "manual") {
    document.documentElement.dataset.theme = theme;

    const button = document.getElementById("themeToggle");
    if (!button) return;

    if (source === "auto") {
        button.innerHTML = theme === "dark"
            ? buttonLabel("mdi-weather-night", "Auto Dark")
            : buttonLabel("mdi-white-balance-sunny", "Auto Light");

        button.title = "Automatic theme active. Click to switch manually.";
    } else {
        button.innerHTML = theme === "dark"
            ? buttonLabel("mdi-white-balance-sunny", "Light")
            : buttonLabel("mdi-weather-night", "Dark");

        button.title = "Manual theme active.";
    }
}

function applyInitialTheme() {
    const storedTheme = getStoredTheme();

    if (storedTheme === "light" || storedTheme === "dark") {
        applyTheme(storedTheme, "manual");
        return;
    }

    applyTheme(getSystemTheme(), "auto");
}

function toggleTheme() {
    const currentTheme = document.documentElement.dataset.theme || getSystemTheme();
    const nextTheme = currentTheme === "dark" ? "light" : "dark";

    localStorage.setItem(THEME_STORAGE_KEY, nextTheme);
    applyTheme(nextTheme, "manual");
}

function resetThemeToAuto() {
    localStorage.removeItem(THEME_STORAGE_KEY);
    applyTheme(getSystemTheme(), "auto");
}

function confirmClearAll() {
    const confirmed = confirm(
        "This will remove all known devices. Device names will not be deleted."
    );

    if (!confirmed) {
        return;
    }

    clearAll();
}

applyInitialTheme();

if (window.matchMedia) {
    const mediaQuery = window.matchMedia("(prefers-color-scheme: dark)");

    mediaQuery.addEventListener("change", () => {
        const storedTheme = getStoredTheme();

        if (storedTheme !== "light" && storedTheme !== "dark") {
            applyTheme(getSystemTheme(), "auto");
        }
    });
}

    </script>
    
    <script src="static/app-state.js?v=2.0.1"></script>
    <script src="static/app-utils.js?v=2.0.1"></script>
    <script src="static/app-api.js?v=2.0.1"></script>
    <script src="static/app-render.js?v=2.0.1"></script>
    <script src="static/app.js?v=2.0.1"></script>

</body>
</html>
